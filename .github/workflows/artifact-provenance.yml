name: Unpublished artifact provenance

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  artifact:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.27.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:verify
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/packages/*.tgz
            artifacts/sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: reverb-unpublished-packages
          path: artifacts/
