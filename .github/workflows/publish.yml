name: Publish packages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release
        run: pnpm release:verify

      - name: Publish public packages
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r package_json; do
            package_dir="$(dirname "$package_json")"
            package_name="$(node -p "require('./${package_json}').name")"
            package_private="$(node -p "require('./${package_json}').private === true")"
            if [[ "$package_private" == "true" ]]; then
              continue
            fi
            echo "Publishing ${package_name}"
            npm publish "$package_dir" --access public
          done < <(find packages -mindepth 2 -maxdepth 2 -name package.json | sort)
