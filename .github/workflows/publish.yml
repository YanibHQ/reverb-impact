name: Publish packages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Check out release
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.27.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release
        run: pnpm release:verify

      - name: Publish verified package tarballs
        shell: bash
        env:
          # Used only to bootstrap package names that cannot yet authorize an OIDC publisher.
          # Existing packages continue to publish through the configured trusted publisher when
          # this temporary secret is absent.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for tarball in artifacts/packages/*.tgz; do
            read -r package_name package_version < <(
              tar -xOf "$tarball" package/package.json |
                node -e "let value=''; process.stdin.setEncoding('utf8'); process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => { const manifest = JSON.parse(value); console.log(manifest.name, manifest.version); });"
            )
            package_spec="${package_name}@${package_version}"
            if npm view "$package_spec" version --json >/dev/null 2>&1; then
              comparison_root=$(mktemp -d)
              mkdir "$comparison_root/packed" "$comparison_root/published"
              published_archive=$(npm pack "$package_spec" --pack-destination "$comparison_root" --silent)
              tar -xzf "$tarball" -C "$comparison_root/packed"
              tar -xzf "$comparison_root/$published_archive" -C "$comparison_root/published"
              if ! diff -qr "$comparison_root/packed/package" "$comparison_root/published/package"; then
                echo "Published $package_spec does not match the verified package contents." >&2
                exit 1
              fi
              echo "Already published with matching contents: $package_spec"
              continue
            fi
            echo "Publishing $package_spec"
            npm publish "$tarball" --access public
          done
