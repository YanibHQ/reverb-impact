name: Publish packages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Check out release
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.27.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release
        run: pnpm release:verify

      - name: Publish verified package tarballs
        shell: bash
        env:
          # Used only to bootstrap package names that cannot yet authorize an OIDC publisher.
          # Existing packages continue to publish through the configured trusted publisher when
          # this temporary secret is absent.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for tarball in artifacts/packages/*.tgz; do
            read -r package_name package_version < <(
              tar -xOf "$tarball" package/package.json |
                node -e "let value=''; process.stdin.setEncoding('utf8'); process.stdin.on('data', chunk => value += chunk); process.stdin.on('end', () => { const manifest = JSON.parse(value); console.log(manifest.name, manifest.version); });"
            )
            package_spec="${package_name}@${package_version}"
            if published_integrity=$(npm view "$package_spec" dist.integrity --json 2>/dev/null); then
              published_integrity=${published_integrity//\"/}
              packed_integrity=$(node -e "const crypto = require('node:crypto'); const fs = require('node:fs'); const bytes = fs.readFileSync(process.argv[1]); console.log('sha512-' + crypto.createHash('sha512').update(bytes).digest('base64'));" "$tarball")
              if [[ "$published_integrity" != "$packed_integrity" ]]; then
                echo "Published $package_spec does not match the verified tarball integrity." >&2
                exit 1
              fi
              echo "Already published and verified $package_spec"
              continue
            fi
            echo "Publishing $package_spec"
            npm publish "$tarball" --access public
          done
